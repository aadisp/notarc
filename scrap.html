<!DOCTYPE html>
<html>
  <head>
    <style>
      .logo-slider {
        width: 100%;
        overflow: hidden;
        background: transparent;
        padding: 20px 0;
      }

      .logo-track {
        display: flex;
        width: max-content;
        animation: scroll-right 40s linear infinite;
      }

      .logo-track img {
        height: 40px;   /* ✅ EXACT SIZE YOU ASKED */
        width: auto;
        margin: 0 25px;
        object-fit: contain;
        opacity: 0.8;
        transition: 0.3s ease;
      }

      .logo-track img:hover {
        opacity: 1;
        transform: scale(1.1);
      }

      /* ✅ TRUE INFINITE LEFT → RIGHT */
      @keyframes scroll-right {
        0% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0);
        }
      }

      .logo-slider:hover .logo-track {
        animation-play-state: paused;
      }

    </style>
  </head>
