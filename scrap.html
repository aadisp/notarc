<!DOCTYPE html>
<html>
  <head>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <style>
        .crtin{
                position: fixed;
                background: linear-gradient(to left,rgba(255, 255, 255, 0.2),rgba(255, 255, 255, 0.2));
                bottom: 0;
                top: 0;
                right: 0;
                left: 0;
                z-index: 1000000;
                cursor: pointer;
            }
            .shingping {
                position: fixed;
                top: 40%;
                left: 50%;
                transform: translate(-50%, -40%); /* shifts it back by half its size */
                width: fit-content;
                display: flex;              /* centers the image inside */
                justify-content: center;
                align-items: center;
                padding: 100px;
            }

            
            .shingpping {
                position: fixed;
                top: 2%;
                left: 50%;
                right:20px;
                transform: (-50%,-2%);
                width: fit-content;
                display: flex;              /* centers the image inside */
                justify-content: end;
            }

            .crtn {
                 width: 100%;
                 height: 100%;
            }
            .crttn {
                 width: 3%;
                 height: 3%;
            }
    
            @media (max-width: 991.98px){
                .crtn{
                width: 300px;
                height: auto;
                margin-right: 33px;
            }
            .crttn {
                width: 20px;
                height: auto;
            }
        }


    </style>


    <style>
      .imig1{
        width: 600px;
      }
      .imig2{
        width: 30px;
        cursor: pointer;
      }
      @media (max-width: 991.98px){
        #adwall{
          margin-top: 150px;
        }
                .imig1{
                  width: 300px;
            }
          
            .imig2 {
              width: 20px;
              padding-left: 5px;
            }
          }
    </style>
</head>

<body>

                </a>
            </div>
            <div class="shingpping">
                    <img  src="img/cncl.png" onclick="curtainOpen()" class="crttn">
            </div>
        </div>  -->  

        <div style="display: flex; justify-content: center;" id="adwall">
          <div>
            <a href="img/poster.png" download="Notarc Internship">
                    <img  src="img/poster.png" onclick="curtainOpen()" class="imig1">
                </a>
          </div>
          <div>
            <img  src="img/cncl.png" onclick="curtainOpen()" class="imig2">
          </div>
        </div>

        <script>
        function curtainOpen() {
            const ell= document.getElementById("adwall");
            ell.style.display = "none";
        }
    </script>
  </body>
</html>
